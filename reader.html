<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Учебник — Практическое руководство</title>
<link rel="stylesheet" href="assets/styles.css">
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/epubjs@0.3.93/dist/epub.min.js"></script>
</head>
<body class="reader-page">
<header class="reader-toolbar">
  <div class="reader-toolbar-inner">
    <div class="reader-actions">
      <a id="returnLink" class="button-link" href="index.html">← Вернуться к вопросу</a>
      <a class="button-link secondary" href="index.html">Главное меню</a>
    </div>
    <div class="reader-title-wrap">
      <div id="readerChapter" class="reader-current-chapter">Загрузка учебника…</div>
    </div>
  </div>
  <div class="reader-nav">
    <button id="prevSection" class="reader-nav-button" type="button"><span class="desktop-label">← Предыдущий раздел</span><span class="mobile-label">← Предыдущий</span></button>
    <label class="reader-select-wrap">
      <span>Раздел учебника</span>
      <select id="sectionSelect" aria-label="Раздел учебника"></select>
    </label>
    <button id="nextSection" class="reader-nav-button" type="button"><span class="desktop-label">Следующий раздел →</span><span class="mobile-label">Следующий →</span></button>
  </div>
</header>

<main class="reader-main">
  <div id="readerError" class="notice error hidden"></div>
  <div id="bookFrame" class="book-frame"></div>
</main>

<script>
(async function(){
  var params=new URLSearchParams(location.search);
  var bookId=params.get('book')||'nefedov';
  var raw=params.get('href')||'';
  var topicId=params.get('topic')||'';
  var returnRaw=params.get('return')||'index.html';
  var safe=/^index_split_\d{3}\.xhtml(?:#[A-Za-z0-9_.:-]+)?$/.test(raw);

  var error=document.getElementById('readerError');
  var viewer=document.getElementById('bookFrame');
  var returnLink=document.getElementById('returnLink');
  var sectionSelect=document.getElementById('sectionSelect');
  var prevButton=document.getElementById('prevSection');
  var nextButton=document.getElementById('nextSection');

  var sourceFragments=[];
  var sourceBase=hrefKey(raw);
  var currentIndex=-1;
  var indexData=[];
  var rendition=null;
  var bookConfig=null;

  function safeReturn(value){
    try{
      var u=new URL(value,location.href);
      if(u.origin===location.origin&&/\/index\.html$/.test(u.pathname))return value;
    }catch(e){}
    return 'index.html';
  }

  function hrefKey(value){
    return String(value||'').split('#')[0].split('/').pop();
  }

  function findIndexByHref(value){
    var key=hrefKey(value);
    return indexData.findIndex(function(item){return hrefKey(item.href)===key;});
  }

  function normText(s){
    return String(s||'').toLowerCase().replace(/ё/g,'е').replace(/[^а-яa-z0-9]+/gi,' ').replace(/\s+/g,' ').trim();
  }

  function overlapScore(fragment,text){
    var fw=Array.from(new Set(normText(fragment).split(' ').filter(function(w){return w.length>3;})));
    if(!fw.length)return 0;
    var tw=new Set(normText(text).split(' ').filter(function(w){return w.length>3;}));
    var hit=fw.filter(function(w){return tw.has(w);}).length;
    return hit/fw.length;
  }

  function applyHighlights(contents){
    if(!sourceFragments.length||currentIndex<0)return;
    var currentBase=hrefKey(indexData[currentIndex].href);
    if(currentBase!==sourceBase)return;

    var doc=contents.document;
    if(!doc)return;

    if(!doc.getElementById('answer-source-style')){
      var style=doc.createElement('style');
      style.id='answer-source-style';
      style.textContent='.answer-source-highlight{background:#fff0a6!important;box-shadow:inset 4px 0 0 #c08b16!important;border-radius:4px!important;padding:.12em .28em!important;}';
      doc.head.appendChild(style);
    }

    Array.from(doc.querySelectorAll('.answer-source-highlight')).forEach(function(el){
      el.classList.remove('answer-source-highlight');
    });

    var all=Array.from(doc.querySelectorAll('p,li,blockquote,div'));
    var candidates=all.filter(function(el){
      var nested=Array.from(el.children).some(function(ch){
        return ['P','LI','BLOCKQUOTE','DIV'].indexOf(ch.tagName)>=0;
      });
      return !nested&&normText(el.textContent).length>=25;
    });
    if(!candidates.length)candidates=Array.from(doc.querySelectorAll('p,li,blockquote,div'));

    var highlighted=[];
    sourceFragments.forEach(function(fragment){
      var nf=normText(fragment);
      var best=null,bestScore=0;
      candidates.forEach(function(el){
        var nt=normText(el.textContent);
        var score=0;
        if(nt.includes(nf)||nf.includes(nt))score=2;
        else if(nf.slice(0,100)&&nt.includes(nf.slice(0,100)))score=1.8;
        else score=overlapScore(fragment,el.textContent);
        if(score>bestScore){bestScore=score;best=el;}
      });
      if(best&&bestScore>=0.55&&!highlighted.includes(best)){
        best.classList.add('answer-source-highlight');
        highlighted.push(best);
      }
    });

    if(highlighted.length){
      setTimeout(function(){highlighted[0].scrollIntoView({behavior:'smooth',block:'center'});},180);
    }
  }

  function sectionLabel(item){
    var context=item&&item.context_title?item.context_title:'';
    var title=item&&item.title?item.title:'';
    if(context&&normText(context)!==normText(title))return context+' — '+title;
    return title;
  }

  function updateHeader(item){
    var chapter=item&&item.chapter?item.chapter:'';
    var title=item&&item.title?item.title:'';
    var prefix=bookConfig?bookConfig.short_label+' · ':'';
    document.getElementById('readerChapter').textContent=prefix+(chapter||'Учебник');
    document.title=(title||chapter||'Учебник')+' — Практическое руководство';
    sectionSelect.value=String(currentIndex);
    prevButton.disabled=currentIndex<=0;
    nextButton.disabled=currentIndex<0||currentIndex>=indexData.length-1;
  }

  async function navigateTo(i,useRaw){
    if(i<0||i>=indexData.length)return;
    currentIndex=i;
    updateHeader(indexData[i]);
    await rendition.display(useRaw?raw:indexData[i].href);
  }

  if(!safe){
    error.textContent='Некорректная ссылка на раздел учебника.';
    error.classList.remove('hidden');
    viewer.classList.add('hidden');
    return;
  }

  returnLink.href=safeReturn(returnRaw);

  try{
    var registry=await fetch('data/textbooks.json').then(function(r){if(!r.ok)throw new Error('textbooks');return r.json();});
    bookConfig=registry.find(function(x){return x.id===bookId;});
    if(!bookConfig)throw new Error('book');

    var loaded=await Promise.all([
      fetch(bookConfig.index_path).then(function(r){if(!r.ok)throw new Error('index');return r.json();}),
      fetch(bookConfig.answers_path).then(function(r){if(!r.ok)throw new Error('answers');return r.json();})
    ]);

    indexData=loaded[0].filter(function(item){return item.usable!==false;});
    var answer=loaded[1].find(function(x){return x.topic_id===topicId;});
    sourceFragments=answer&&Array.isArray(answer.source_fragments)?answer.source_fragments:[];

    var groups=new Map();
    indexData.forEach(function(item,i){
      var groupName=item.chapter||'Начальные разделы';
      var group=groups.get(groupName);
      if(!group){
        group=document.createElement('optgroup');
        group.label=groupName;
        groups.set(groupName,group);
        sectionSelect.appendChild(group);
      }
      var opt=document.createElement('option');
      opt.value=String(i);
      opt.textContent=sectionLabel(item);
      group.appendChild(opt);
    });

    currentIndex=findIndexByHref(raw);
    if(currentIndex<0)throw new Error('section');

    if(typeof ePub!=='function')throw new Error('epubjs');
    var book=ePub(bookConfig.epub_path);
    rendition=book.renderTo('bookFrame',{width:'100%',height:'100%',spread:'none',flow:'scrolled-doc'});

    rendition.hooks.content.register(function(contents){
      setTimeout(function(){applyHighlights(contents);},30);
    });

    rendition.on('rendered',function(){
      var contents=rendition.getContents();
      if(contents&&contents.length)setTimeout(function(){applyHighlights(contents[0]);},40);
    });

    rendition.on('relocated',function(location){
      var href=location&&location.start?location.start.href:'';
      var i=findIndexByHref(href);
      if(i>=0){
        currentIndex=i;
        updateHeader(indexData[i]);
      }
    });

    sectionSelect.addEventListener('change',function(){navigateTo(Number(sectionSelect.value),false);});
    prevButton.addEventListener('click',function(){navigateTo(currentIndex-1,false);});
    nextButton.addEventListener('click',function(){navigateTo(currentIndex+1,false);});

    await navigateTo(currentIndex,true);
  }catch(e){
    console.error(e);
    error.textContent='Не удалось открыть встроенный раздел учебника. Вернитесь в главное меню и попробуйте ещё раз.';
    error.classList.remove('hidden');
  }
})();
</script>
</body>
</html>
