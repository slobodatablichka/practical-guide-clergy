name: Build study data

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-study-data.yml'
      - 'source/**'
      - 'assets/book/taintstva-i-obryady-pravoslavnoy-tserkvi.epub'
      - 'assets/book/silchenkov-prakticheskoe-rukovodstvo-pri-sovershenii-prikhodskikh-treb.epub'
      - 'scripts/extract_book_index.py'
      - 'scripts/build_question_registry.py'
      - 'scripts/build_answers.py'
      - 'scripts/build_textbook_sources.py'
      - 'scripts/validate_data.py'

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install parser
        run: python -m pip install beautifulsoup4

      - name: Verify canonical textbook EPUBs exist
        run: |
          test -f assets/book/taintstva-i-obryady-pravoslavnoy-tserkvi.epub
          test -f assets/book/silchenkov-prakticheskoe-rukovodstvo-pri-sovershenii-prikhodskikh-treb.epub

      - name: Build textbook 1 index
        run: python scripts/extract_book_index.py

      - name: Build normalized question registry
        run: python scripts/build_question_registry.py

      - name: Build textbook 1 concise answers
        run: python scripts/build_answers.py

      - name: Build multi-textbook sources
        run: python scripts/build_textbook_sources.py

      - name: Validate generated data
        run: python scripts/validate_data.py

      - name: Commit generated study data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data docs
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Generate two-textbook study data"
            git push
          fi
